<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}whisperx-uxpipeline{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: #e8ecf0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding-bottom: 56px; min-height: 100vh; }
    .navbar { background: #fff; border-bottom: 1px solid #e2e8f0; }
    [data-bs-theme="dark"] body { background: #1a2540; }
    [data-bs-theme="dark"] .navbar { background: #1e293b !important; border-color: #334155 !important; }

    .card { border: 1px solid #e2e8f0; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    [data-bs-theme="dark"] .card { background: #2a3a4f; border-color: #334155; color: #f1f5f9; }
    [data-bs-theme="dark"] .table { color: #f1f5f9; }
    [data-bs-theme="dark"] .table-light { background: #334155; color: #f1f5f9; --bs-table-bg: #334155; }
    [data-bs-theme="dark"] .text-muted { color: #94a3b8 !important; }

    .btn-orange { background: #f97316; color: #fff; border: none; }
    .btn-orange:hover { background: #ea580c; color: #fff; }

    .badge-status { display: inline-flex; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; align-items: center; }
    .badge-pending { background: #f8fafc; color: #64748b; border: 1px solid #e2e8f0; }
    .badge-running { background: #fff7ed; color: #ea580c; border: 1px solid #fed7aa; }
    .badge-done    { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .badge-failed  { background: #fff1f2; color: #dc2626; border: 1px solid #fecdd3; }

    .footer-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; border-top: 1px solid #e2e8f0; padding: 10px 24px; text-align: center; font-size: 11px; color: #94a3b8; z-index: 999; }
    [data-bs-theme="dark"] .footer-bar { background: #1e293b; border-color: #334155; color: #64748b; }

    details.collapsible > summary { list-style: none; cursor: pointer; user-select: none; }
    details.collapsible > summary::-webkit-details-marker { display: none; }
    details.collapsible .chevron { display: inline-block; transition: transform .15s; color: #94a3b8; font-size: 12px; margin-left: 6px; }
    details.collapsible:not([open]) .chevron { transform: rotate(-90deg); }

    .about-section { margin-bottom: 24px; }
    .about-section p { font-size: 14px; color: #475569; line-height: 1.75; margin-bottom: 6px; }
    .about-title { font-size: 12px; font-weight: 700; color: #f97316; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 10px; }
    .about-list { font-size: 14px; color: #475569; line-height: 1.75; padding-left: 18px; margin-bottom: 0; }
    .about-list li { margin-bottom: 6px; }
    [data-bs-theme="dark"] .about-section p,
    [data-bs-theme="dark"] .about-list { color: #cbd5e1; }
    [data-bs-theme="dark"] .about-title { color: #f97316; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

<nav class="navbar border-bottom px-3 px-md-4 py-2 d-flex align-items-center">
  <a href="/" class="d-flex align-items-center gap-2 text-decoration-none" style="color:inherit">
    <span style="font-size:22px">🎙️</span>
    <span style="font-weight:700;letter-spacing:.05em;font-size:14px">whisperx-uxpipeline</span>
  </a>
  <span class="ms-auto text-muted small me-2 d-none d-md-inline">{{ user }}</span>
  <button id="themeToggle" onclick="toggleTheme()" class="btn p-0 border-0" style="font-size:16px;background:none" title="Toggle theme">🌛</button>
</nav>

<div class="container py-4" style="max-width:1100px;padding-bottom:56px">
  {% block content %}{% endblock %}
</div>

<div class="footer-bar">
  <a href="https://github.com/uxbryan/whisperx-uxpipeline" class="text-muted text-decoration-none">whisperx-uxpipeline</a>
  · MIT License
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function _getCookie(k){return(document.cookie.match('(^|;)\\s*'+k+'=([^;]*)')||[])[2]||'';}
function _setCookie(k,v){document.cookie=k+'='+v+';path=/;max-age=31536000;SameSite=Lax';}
function applyTheme(t){
  document.documentElement.setAttribute('data-bs-theme', t);
  document.getElementById('themeToggle').textContent = t === 'dark' ? '☀️' : '🌛';
}
function toggleTheme(){
  const n = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
  _setCookie('theme', n); applyTheme(n);
}
(function(){ applyTheme(_getCookie('theme') || 'light'); })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
